name: Deploy STEWARO Account

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "12,27,42,57 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: stewaro-account-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout canonical STEWARO account source
        uses: actions/checkout@v6
        with:
          repository: denizw030/senioren-concierge-berlin
          ref: feature/stewaro-shared-base-brand-shell-20260927
          path: source
          fetch-depth: 1

      - name: Build account artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'tests/' \
            --exclude 'orfidel-preview/' \
            --exclude 'stewaro-site/' \
            source/ _site/

          cp source/zugang.html _site/index.html
          touch _site/.nojekyll
          printf '%s\n' "$(git -C source rev-parse HEAD)" > _site/.stewaro-source-sha

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("_site")
          base = "/stewaro-account"
          allowed = {".html",".css",".js",".json",".xml",".txt",".webmanifest"}
          quoted_root = re.compile(r'''(?P<q>["'])(?P<p>/(?!/)(?!stewaro-account(?:/|["']))[^"'\s]*)''')

          for path in root.rglob("*"):
              if not path.is_file() or path.suffix.lower() not in allowed:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue

              def repl(m):
                  p=m.group("p")
                  if p == "/":
                      return m.group("q") + base + "/"
                  return m.group("q") + base + p

              patched=quoted_root.sub(repl,text)

              if path.suffix.lower()==".html" and 'name="robots"' not in patched:
                  patched=patched.replace("<head>","<head>\n  <meta name=\"robots\" content=\"noindex,nofollow\">",1)

              path.write_text(patched,encoding="utf-8")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload account artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy account site
        id: deployment
        uses: actions/deploy-pages@v4
